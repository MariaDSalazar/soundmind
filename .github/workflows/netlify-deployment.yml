name: Netlify deployment

# Refleja en la pestaña "Deployments" del repo el entorno de PRODUCCIÓN vivo
# (frontend en Netlify). Netlify hace el deploy real; esto solo crea el registro
# verde con el enlace, para que "Production" en GitHub apunte a la demo en vivo.
on:
  push:
    branches: [main]

permissions:
  deployments: write
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://soundmind19.netlify.app';
            const dep = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'Production',
              production_environment: true,
              required_contexts: [],
              auto_merge: false,
              description: 'Frontend desplegado en Netlify',
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: dep.data.id,
              state: 'success',
              environment_url: url,
              description: 'En vivo en Netlify',
            });
