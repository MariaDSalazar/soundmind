name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (TypeScript estricto)
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Build (mismo comando que Vercel)
        run: npm run build -w apps/web

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  recommender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El ranker híbrido (F4) es lógica pura: solo necesita pydantic para testear.
      - name: Tests del recommender (ranker híbrido)
        run: |
          pip install pydantic pytest
          python -m pytest services/recommender/tests -q
