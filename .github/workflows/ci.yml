name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck (TypeScript estricto)
        run: npm run typecheck

      - name: Tests + cobertura de dominio (umbral 80%)
        run: npm run test:coverage

      - name: Build (mismo comando que Netlify)
        run: npm run build -w apps/web

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  recommender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El dominio del recommender (ranker + casos de uso) es lógica pura: solo
      # necesita pydantic para testear. Cobertura con umbral 80% (§13).
      - name: Tests + cobertura del recommender (umbral 80%)
        working-directory: services/recommender
        run: |
          pip install pydantic pytest pytest-cov
          python -m pytest tests --cov=app/application --cov=app/domain --cov-fail-under=80 -q
