name: CodeQL

# Análisis estático de seguridad (§9). Gratis en repos públicos. Cubre el código
# TypeScript/JS (servicios + web) y Python (recommender + jobs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # lunes 03:00 UTC

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - uses: actions/checkout@v6

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
