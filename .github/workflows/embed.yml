name: train-recommender

# Batch nocturno del Recommender. Corre en el runner de GitHub (no en Render):
#  - embed:  embeddings de contenido (F3, torch). Ver ADR-012.
#  - collab: ALS colaborativo + track_stats (F4, implicit). Ver ADR-013.
# `collab` necesita los tracks ya ingeridos por `embed`, de ahí el `needs`.
on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC, nocturno
  workflow_dispatch: {}    # disparo manual desde la pestaña Actions

# Evita solapes si un run tarda más que el intervalo.
concurrency:
  group: train-recommender
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jobs/embed/requirements.txt

      - name: Instalar dependencias
        run: pip install -r jobs/embed/requirements.txt

      - name: Generar embeddings (contenido)
        run: python jobs/embed/embed.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  collab:
    needs: embed          # los factores referencian tracks ya ingeridos (FK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.11: `implicit` 0.7.2 publica wheels hasta 3.11; en 3.12 pip
      # intentaría compilar desde fuente (lento/frágil). Ver jobs/collab/requirements.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: jobs/collab/requirements.txt

      - name: Instalar dependencias
        run: pip install -r jobs/collab/requirements.txt

      - name: Entrenar ALS colaborativo + stats
        run: python jobs/collab/train_als.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
