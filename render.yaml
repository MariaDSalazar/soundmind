# Render Blueprint — despliega gateway + music con Docker (free tier).
# En https://dashboard.render.com → New → Blueprint → conectar este repo.
# Las variables con sync:false se piden al crear el blueprint (son secretos).
services:
  - type: web
    name: soundmind-music
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/music/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true # CD: cada push a main redespliega
    envVars:
      - key: MUSIC_PORT
        value: "10000" # puerto que Render expone por defecto
      - key: AUDIUS_APP_NAME
        value: soundmind
      - key: JAMENDO_CLIENT_ID
        sync: false # API key gratis: https://devportal.jamendo.com/

  - type: web
    name: soundmind-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GATEWAY_PORT
        value: "10000"
      - key: MUSIC_SERVICE_URL
        value: https://soundmind-music.onrender.com
      - key: USERS_SERVICE_URL
        value: https://soundmind-users.onrender.com
      - key: CORS_ORIGINS
        sync: false # URL del frontend en Netlify, ej. https://soundmind19.netlify.app
      # F2: el gateway ahora persiste usuarios en PostgreSQL (Neon)
      - key: DATABASE_URL
        sync: false # Neon pooled. IMPORTANTE: usar solo ?sslmode=require — quitar
                    # &channel_binding=require (rompe el driver pg en el Docker de Render)
      - key: JWT_PRIVATE_KEY
        sync: false # PEM o base64 (recomendado: base64, no se rompe al pegar)
      - key: JWT_PUBLIC_KEY
        sync: false

  # F2: servicio de usuarios (perfil, likes, eventos de escucha)
  - type: web
    name: soundmind-users
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/users/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: USERS_PORT
        value: "10000"
      - key: LISTEN_EVENTS_STREAM
        value: listen-events
      - key: DATABASE_URL
        sync: false # mismo Neon que el gateway
      - key: REDIS_URL
        sync: false # Upstash (rediss://) para los Redis Streams
      - key: JWT_PUBLIC_KEY
        sync: false # MISMA clave pública del gateway (verifica sus JWT)
