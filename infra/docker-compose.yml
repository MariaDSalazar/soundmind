# Levantar todo el stack en local:
#   docker compose -f infra/docker-compose.yml up --build
# Web en http://localhost:5173 — gateway :4000 — music :4002
# Variables opcionales (JAMENDO_CLIENT_ID...) se leen del .env de la raíz.
name: soundmind

services:
  music:
    build:
      context: ..
      dockerfile: services/music/Dockerfile
    environment:
      MUSIC_PORT: "4002"
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      AUDIUS_APP_NAME: ${AUDIUS_APP_NAME:-soundmind}
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4002/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_PORT: "4000"
      CORS_ORIGINS: http://localhost:5173
      # Red interna de compose: el gateway resuelve "music" por nombre de servicio
      MUSIC_SERVICE_URL: http://music:4002
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      music:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # El navegador llama al gateway desde el host, no desde la red interna
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      gateway:
        condition: service_healthy
